[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agile-nero"
version = "0.1.0"
description = "NERO robotic line-drawing development environment and receive-only diagnostics"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pyAgxArm",
  "python-can[gs-usb]==4.6.1",
  "gs-usb==0.3.1",
  "pyusb>=1.3,<2",
  "pyserial>=3.5,<4",
  "numpy>=2.2,<3",
  "scipy>=1.15,<2",
  "opencv-python-headless>=4.11,<5",
  "scikit-image>=0.25,<1",
  "svgpathtools>=1.7,<2",
  "matplotlib>=3.10,<4",
  "mujoco>=3.3,<4",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
workflow = ["langgraph>=1,<2"]
ml = ["torch>=2.6,<3", "torchvision>=0.21,<1"]

[project.scripts]
nero = "agile_nero.robot.diagnostics.cli:main"
nero-dry-run = "agile_nero.api.cli:main"

[project.entry-points."can.interface"]
nero_gs_usb = "agile_nero.robot.diagnostics.transport:NativeGsUsbBus"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.uv.sources]
pyAgxArm = { git = "https://github.com/agilexrobotics/pyAgxArm.git", rev = "841a625f5f4920e776f20b934eb13048b747e6d0" }

[tool.hatch.build.targets.wheel]
packages = ["src/agile_nero"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
